plugins {
    id 'com.android.application'
}

android {
    namespace 'com.himansho.pharmalab'
    compileSdk 34

    defaultConfig {
        applicationId "com.himansho.pharmalab"
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName "1.0.0" // standalone full-app build
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
